    <path d="M 0 24 Q 0 0 24 0 L 496 0 Q 520 0 520 24 L 520 180 L 0 180 Z" fill="url(#bpiGrad)"/>
    
    <text x="260" y="55" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="1">BPI ONLINE CONFIRMATION</text>
    <text x="260" y="82" fill="#FFDADA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">Funds Transfer Successful</text>

    <g transform="translate(260, 135)">
      <circle cx="0" cy="0" r="32" fill="#FFFFFF"/>
