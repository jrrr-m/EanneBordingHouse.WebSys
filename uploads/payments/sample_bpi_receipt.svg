      <stop offset="0%" stop-color="#B31B1B"/>
      <stop offset="100%" stop-color="#800000"/>
    </linearGradient>
    <filter id="shadowBpi" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="600" height="850" fill="#F4F4F6"/>

  <g transform="translate(40, 30)" filter="url(#shadowBpi)">
