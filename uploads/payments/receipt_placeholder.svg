      <rect x="141" y="0" width="4" height="40" fill="#2D3748"/>
      <rect x="149" y="0" width="3" height="40" fill="#2D3748"/>
      <rect x="156" y="0" width="6" height="40" fill="#2D3748"/>
      <rect x="166" y="0" width="2" height="40" fill="#2D3748"/>
      <rect x="172" y="0" width="5" height="40" fill="#2D3748"/>
      <rect x="181" y="0" width="7" height="40" fill="#2D3748"/>
      <rect x="192" y="0" width="4" height="40" fill="#2D3748"/>
      <rect x="200" y="0" width="2" height="40" fill="#2D3748"/>
      <rect x="206" y="0" width="6" height="40" fill="#2D3748"/>
      <rect x="216" y="0" width="3" height="40" fill="#2D3748"/>
      <rect x="223" y="0" width="8" height="40" fill="#2D3748"/>
      <rect x="235" y="0" width="2" height="40" fill="#2D3748"/>
      <rect x="241" y="0" width="5" height="40" fill="#2D3748"/>
      <rect x="250" y="0" width="4" height="40" fill="#2D3748"/>
      <rect x="258" y="0" width="7" height="40" fill="#2D3748"/>
      <rect x="269" y="0" width="3" height="40" fill="#2D3748"/>
      <rect x="276" y="0" width="5" height="40" fill="#2D3748"/>
      <rect x="285" y="0" width="2" height="40" fill="#2D3748"/>
      <rect x="291" y="0" width="6" height="40" fill="#2D3748"/>
      <rect x="301" y="0" width="4" height="40" fill="#2D3748"/>
      <rect x="309" y="0" width="3" height="40" fill="#2D3748"/>
      <rect x="316" y="0" width="7" height="40" fill="#2D3748"/>
      <rect x="327" y="0" width="2" height="40" fill="#2D3748"/>
      <rect x="333" y="0" width="5" height="40" fill="#2D3748"/>
      <rect x="342" y="0" width="6" height="40" fill="#2D3748"/>
      <rect x="352" y="0" width="4" height="40" fill="#2D3748"/>
      <rect x="360" y="0" width="2" height="40" fill="#2D3748"/>
      <rect x="366" y="0" width="7" height="40" fill="#2D3748"/>
      <rect x="377" y="0" width="3" height="40" fill="#2D3748"/>
      <rect x="384" y="0" width="5" height="40" fill="#2D3748"/>
      <rect x="393" y="0" width="4" height="40" fill="#2D3748"/>
    </g>
    <text x="260" y="740" fill="#A0AEC0" font-family="'Courier New', monospace" font-size="12" font-weight="700" text-anchor="middle">EBH-VERIFIED-TRANSACTION-AUDIT-TRAIL</text>
    <text x="260" y="765" fill="#718096" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Keep this electronic receipt for your records • Thank you for paying on time</text>
  </g>
